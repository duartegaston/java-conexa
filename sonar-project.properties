# Configuración del proyecto para SonarQube
# Este archivo define cómo SonarQube analiza el proyecto cuando se ejecuta:
#   mvn sonar:sonar -Dsonar.host.url=http://localhost:9000 -Dsonar.login=<token>

# Identificador único del proyecto en SonarQube
sonar.projectKey=bookhub-api

# Nombre que se muestra en la interfaz de SonarQube
sonar.projectName=BookHub API

# Versión del proyecto (puede coincidir con la del pom.xml)
sonar.projectVersion=1.0.0

# Directorio raíz del proyecto
sonar.sources=src/main/java

# Directorio de tests (SonarQube los analiza por separado)
sonar.tests=src/test/java

# Reporte de cobertura generado por JaCoCo (mvn test genera este archivo)
# SonarQube lo usa para calcular el porcentaje de cobertura
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Clases excluidas del análisis de cobertura:
# - DTOs: son clases de datos sin lógica de negocio
# - Entities: son modelos JPA, no lógica
# - La clase main de la aplicación
sonar.coverage.exclusions=\
    **/model/dto/**/*,\
    **/model/entity/**/*,\
    **/BookhubApiApplication.java

# Clases excluidas del análisis de código:
# Mismo criterio que la cobertura
sonar.exclusions=\
    **/model/dto/**/*,\
    **/model/entity/**/*,\
    **/BookhubApiApplication.java

# Encoding del código fuente
sonar.sourceEncoding=UTF-8

# Versión de Java para el análisis
sonar.java.source=17

# Binarios compilados (SonarQube los necesita para el análisis estático de bytecode)
sonar.java.binaries=target/classes

# Clases de test compiladas
sonar.java.test.binaries=target/test-classes

# Quality Gate: umbral mínimo de cobertura para que el análisis sea exitoso (80%)
# Si la cobertura baja de este valor, SonarQube marca el análisis como FAILED
# Esto se configura en la interfaz de SonarQube, aquí solo es referencia
# sonar.coverage.minimum=80.0
